name: Destroy Infrastructure

on:
  workflow_dispatch:

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout
        uses: actions/checkout@v3

      # =========================
      # AWS CREDENTIALS
      # =========================
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # =========================
      # TERRAFORM SETUP
      # =========================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # =========================
      # INIT TERRAFORM
      # =========================
      - name: Terraform Init
        run: terraform init
        
      - name: Delete all ECR images
        run: |
          if aws ecr describe-repositories \
            --repository-names node-app \
            --region ${{ secrets.AWS_REGION }} > /dev/null 2>&1; then

            aws ecr list-images \
              --repository-name node-app \
              --region ${{ secrets.AWS_REGION }} \
              --query 'imageIds[*]' \
              --output json > images.json

            if [ "$(cat images.json)" != "[]" ]; then
              aws ecr batch-delete-image \
                --repository-name node-app \
                --region ${{ secrets.AWS_REGION }} \
                --image-ids file://images.json
            else
              echo "No images found"
            fi

          else
            echo "ECR repository does not exist"
          fi
   
      # =========================
      # DESTROY INFRASTRUCTURE
      # =========================
      - name: Terraform Destroy
        run: terraform destroy -auto-approve

      # =========================
      # CLEAN ECS (SAFE DELETE FALLBACK)
      # =========================
      - name: Force delete ECS service (if still exists)
        run: |
          aws ecs update-service \
            --cluster node-app-cluster \
            --service node-app-service \
            --desired-count 0 \
            --region ${{ secrets.AWS_REGION }}  || true

          aws ecs delete-service \
            --cluster node-app-cluster \
            --service node-app-service \
            --force \
            --region ${{ secrets.AWS_REGION }} || true

      # =========================
      # DELETE ECS CLUSTER (optional cleanup)
      # =========================
      - name: Delete ECS Cluster
        run: |
          aws ecs delete-cluster \
            --cluster node-app-cluster \
            --region ${{ secrets.AWS_REGION }} || true

      # =========================
      # DELETE ECR REPOSITORY (optional)
      # =========================
      - name: Delete ECR Repository
        run: |
          aws ecr delete-repository \
            --repository-name node-app \
            --force \
            --region ${{ secrets.AWS_REGION }} || true
