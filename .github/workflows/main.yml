name: Manual Deploy to ECR

on:
  workflow_dispatch:

jobs:
  deploy:
     runs-on: ubuntu-latest

     steps:
       - name: Checkout
         uses: actions/checkout@v3

       - name: Configure AWS
         uses: aws-actions/configure-aws-credentials@v2
         with:
           aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
           aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
           aws-region: ${{ secrets.AWS_REGION }}

       - name: Ensure ECR repository exists
         run: |
          aws ecr describe-repositories --repository-names node-app --region ${{ secrets.AWS_REGION }} || aws ecr create-repository --repository-name node-app --region ${{ secrets.AWS_REGION }}
 
       - name: Login to ECR
         run: |
           aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com 
          
       - name: Build and Push (amd64)
         run: |
          docker buildx build --platform linux/amd64 -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/node-app:latest --push ./app

       - name: Ensure ECS Cluster exists
         run: |
           COUNT=$(aws ecs list-clusters --region us-east-1 --query "length(clusterArns[?contains(@, 'node-app-cluster')])")

           if [ "$COUNT" = "0" ]; then
             aws ecs create-cluster --cluster-name node-app-cluster --region us-east-1
           fi
       
       - name: Download task definition 
         run: | 
          aws ecs describe-task-definition  --task-definition node-app  --query taskDefinition > task-def.json  
       
       - name: Render new task definition
         id: render
         uses: aws-actions/amazon-ecs-render-task-definition@v1
         with:
           task-definition: task-def.json
           container-name: app
           image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/node-app:latest
     
       - name: Get networking info
        id: net
        run: |
          echo "SUBNETS=$(aws ec2 describe-subnets --query 'Subnets[*].SubnetId' --output text | tr '\t' ',')" >> $GITHUB_OUTPUT
          echo "SG=$(aws ec2 describe-security-groups --query 'SecurityGroups[0].GroupId' --output text)" >> $GITHUB_OUTPUT


       - name: Ensure ECS Service exists
         run: |
          aws ecs describe-services --cluster node-app-cluster --services node-app-service --region us-east-1 || aws ecs create-service --cluster node-app-cluster --service-name node-app-service --task-definition node-app --desired-count 1 --launch-type FARGATE --region us-east-1
       
       - name: Deploy to ECS 
         uses: aws-actions/amazon-ecs-deploy-task-definition@v2 
         with: 
           task-definition: ${{ steps.render.outputs.task-definition }} 
           service: ${{ secrets.ECS_SERVICE_NAME }} 
           cluster: ${{ secrets.ECS_CLUSTER_NAME }} 
           wait-for-service-stability: true
